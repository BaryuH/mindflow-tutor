# Tooling config only — runtime dependencies live in requirements-*.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["data"]

[tool.ruff.lint]
# Start with errors that are real bugs; tighten (add "I", "B", "UP"...) incrementally.
select = ["E9", "F63", "F7", "F82", "F401", "F811", "F841"]
