# Local development.
#   docker compose up -d mongo                 # just MongoDB, run backend/client natively
#   docker compose --profile full up --build   # whole app from Dockerfile.prod on :8000
services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile.prod
    env_file: backend/.env
    environment:
      MONGO_URL: mongodb://mongo:27017
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
